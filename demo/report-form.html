<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'">
<title>日報の送信なしテスト</title><link rel="stylesheet" href="../ui.css"><link rel="stylesheet" href="../daily-report.css"></head>
<body><main class="popup-shell">
<section role="dialog" aria-labelledby="reportHeading" class="panel"><h2 id="reportHeading">実績を登録</h2>
<p class="field-note">ローカルの架空フォームです。保存機能はありません。公開画面の案件・時間・詳細入力の構成を再現しています。</p>
<div class="form-grid"><label for="date">日付<input id="date" type="date" value="2026-10-08"></label><span></span>
<label for="start">業務開始時刻<input id="start" type="time"></label><label for="end">業務終了時刻<input id="end" type="time"></label></div>
<article class="report-project"><div class="form-grid"><label for="project1">案件<input id="project1" role="combobox" value="社内サンプル"></label><label for="hours1">時間<input id="hours1" type="number" min="0" max="24" step="0.5"></label></div><label for="notes1">この案件で今日やったこと<textarea id="notes1" rows="2"></textarea></label></article>
<article class="report-project"><div class="form-grid"><label for="project2">案件<input id="project2" role="combobox" value="検証サンプル"></label><label for="hours2">時間<input id="hours2" type="number" min="0" max="24" step="0.5"></label></div><label for="notes2">この案件で今日やったこと<textarea id="notes2" rows="2"></textarea></label></article>
<p>保存・送信回数：<output id="submitCount">0</output></p><button id="fakeSave" type="button" disabled>保存（検証用・無効）</button></section>
<section class="panel"><button class="secondary" id="runSafetyTests" type="button">入力処理の安全性テストを実行</button><button class="secondary" id="resetFixture" type="button">架空フォームを初期状態に戻す</button><pre id="safetyResult" role="status"></pre></section>
</main><script src="../daily-report-adapter.js"></script><script src="report-form.js"></script></body></html>
